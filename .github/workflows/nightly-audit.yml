name: nightly-audit
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - run: researchctl validate
      - name: Audit every active hypothesis
        shell: bash
        run: |
          shopt -s nullglob
          for f in hypotheses/H-*.yaml; do
            id="$(basename "$f" .yaml)"
            echo "::group::$id"
            researchctl audit "$id" || exit 1
            echo "::endgroup::"
          done
