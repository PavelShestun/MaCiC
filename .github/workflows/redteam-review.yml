name: redteam-review
on:
  workflow_run:
    workflows: [redteam-prepare]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  review:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # IMPORTANT: checkout trusted default branch, never the PR head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          name: redteam-input
          path: /tmp/redteam-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Run trusted red-team caller
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MATH_CICD_REDTEAM_MODEL: ${{ vars.MATH_CICD_REDTEAM_MODEL || 'gpt-5' }}
        run: |
          mkdir -p /tmp/redteam-output
          for p in /tmp/redteam-input/*-prompt.md; do
            [ -e "$p" ] || continue
            base="$(basename "$p" -prompt.md)"
            python scripts/redteam_openai.py "$p" "/tmp/redteam-output/${base}.md"
          done
      - name: Comment review on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr="$(cat /tmp/redteam-input/pr-number.txt)"
          body=/tmp/redteam-comment.md
          {
            echo '## Automated adversarial mathematics review'
            echo
            echo '> Advisory only. This bot cannot certify correctness or novelty.'
            for f in /tmp/redteam-output/*.md; do
              [ -e "$f" ] || continue
              echo
              echo "### $(basename "$f" .md)"
              cat "$f"
            done
          } > "$body"
          gh pr comment "$pr" --body-file "$body"
      - uses: actions/upload-artifact@v4
        with:
          name: redteam-review
          path: /tmp/redteam-output
