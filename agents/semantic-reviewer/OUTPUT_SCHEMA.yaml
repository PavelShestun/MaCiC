type: object
required: [hypothesis_id, role, decision, definitions_match_intent, assumptions_explicit, conclusion_matches_claim, hidden_trivialization_checked, unresolved_risks]
properties:
  hypothesis_id: {type: string}
  role: {const: semantic-reviewer}
  decision: {enum: [PASS, FAIL, INCONCLUSIVE]}
  definitions_match_intent: {type: boolean}
  assumptions_explicit: {type: boolean}
  conclusion_matches_claim: {type: boolean}
  hidden_trivialization_checked: {type: boolean}
  mismatches: {type: array}
  unresolved_risks: {type: array}
